<div class="navbar-expand-md bs-sidebar hidden-print affix" role="complementary">
    <div class="navbar-header">
        <button type="button" class="navbar-toggler collapsed" data-bs-toggle="collapse" data-bs-target="#toc-collapse" title="{% trans %}Table of Contents{% endtrans %}">
            <span class="fa fa-angle-down"></span>
        </button>
    </div>

    {%- from "macros.html" import toc_item with context %}
    <div id="toc-collapse" class="navbar-collapse collapse card bg-body-tertiary">
        <ul class="nav flex-column">
        {%- for item in page.toc %}
            {{ toc_item(item, first=contents_entry if item.level == 1) }}
        {%- endfor %}
        </ul>
        {#- The current entry's background and bar, which glide between entries (css/extend.css) #}
        <span class="toc-current-bg" aria-hidden="true"></span>
        <span class="toc-current-bar" aria-hidden="true"></span>
    </div>
</div>
