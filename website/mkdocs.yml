site_name: Awesome micro:bit
site_description: "A curated list of resources for the BBC micro:bit: editors, libraries, projects, teaching resources and more."
site_author: Carlos Pereira Atencio
site_url: https://awesomemicrobit.embeddedlog.com
repo_url: https://github.com/carlosperate/awesome-microbit
site_dir: site/
# This directory is created by the build.py script
docs_dir: site_src/

theme:
  name: mkdocs
  custom_dir: theme/
  user_color_mode_toggle: true
  color_mode: light
  locale: en
  next_prev: false
  # Sections and their subsections in the sidebar
  navigation_depth: 3
  highlightjs: false
  # The home page's Contents tiles after its header (contents-tiles.html), one per section with
  # entries. The README's own Contents is under hidden_sections, below.
  contents_tiles:
    id: contents
    title: "🗂️ Contents"
  # The home page's header (hero.html), in place of the README's title, badges, logo and links
  hero:
    lead: 'A curated list of resources for the <a href="https://microbit.org">BBC micro:bit</a>, a tiny programmable computer designed to make learning and teaching easy and fun!'
    about: 'The micro:bit board has a Bluetooth microcontroller, USB interface, accelerometer, magnetometer, light and temperature sensors, 5x5 LED matrix, buttons, and GPIO accessible via the edge connector.'
    bluesky: https://bsky.app/profile/awesomemicrobit.bsky.social
  # The panel at the end of the home page (end.html), after the list
  end:
    title: "Something missing?"
    text: "Help the list grow! Awesome micro:bit is curated by its community. Suggest a resource, or follow us for new entries."

nav:
  - Home: README.md
  - About:
    - Contributing: contributing.md
    - Code of Conduct: code-of-conduct.md

hooks:
  - hooks/hidden_sections.py
  - hooks/github_anchors.py
  - hooks/awesome_list.py
  - hooks/heading_emoji.py

# Empty, as leaving it out turns on MkDocs' search plugin
plugins: []

extra:
  # README sections (## headings) the site leaves out, by anchor (hooks/hidden_sections.py)
  hidden_sections:
    - contents
    - license
  # Options for hooks/awesome_list.py
  awesome_list:
    debug-log: false
    # By default using the "media" cards with the preview image
    default-style: media
    # Keyed by heading anchor, for sections that are mostly GitHub repos
    section-styles:
      # "index" is a compact view with two columns and favicons instead of media preview
      micropython-libraries: index
      micropython-libraries-hardware-drivers: index
      python-libraries: index
      makecode-extensions: index
      makecode-extensions-hardware-drivers: index
      nodejs-and-browser: index
      cc-libraries: index
      cc-libraries-hardware-drivers: index
      rust-libraries-examples: index
      rust-rtos-targeting-microbit: index
      programming-tools: index
      projects-using-microbit-as-a-dev-board: index
      interface-chip: index
      hardware: index
      project-collections: index
      article-collections: index
      community: index
      # "gallery" shows the cards in columns, with their pictures on top
      microbit-live: gallery
      other-conference-talks: gallery
      3d-printing: gallery
      posters: gallery
      # "shelf" is a special style designed to display book covers on shelves
      books: shelf
    # Images to show instead of a link's own preview, keyed by link.
    # Currently used to ensure we are displaying the Books covers.
    images:
      "https://iot-programmer.com/index.php/books/micro-bit-iot-in-c": images/microbit-iot-in-c.webp
      "https://www.oreilly.com/library/view/programming-with-micropython/9781491972724/": images/programming-with-micropython.webp
      "https://www.oreilly.com/library/view/getting-started-with/9781680453010/": images/getting-started-with-the-microbit.webp
      "https://www.wiley.com/en-gb/The+Official+BBC+micro%3Abit+User+Guide+-p-9781119386735": images/the-official-bbc-microbit-user-guide.webp
      "http://simonmonk.org/prog-mb": images/programming-the-bbc-microbit.webp
      "https://github.com/nominetresearch/microbit-networking-book": images/networking-with-the-microbit-ebook.webp
      "https://www.techagekids.com/2017/11/our-beginner-bbc-microbit-coding-craft-project-book-microbit-in-wonderland.html": images/microbit-in-wonderland.webp
      "https://link.springer.com/book/10.1007/978-1-4842-3360-3": images/beginning-bbc-microbit.webp
      "https://link.springer.com/book/10.1007/978-1-4842-4913-0": images/bbc-microbit-recipes.webp
      "https://nostarch.com/microbitformad": images/microbit-for-mad-scientists.webp
      "https://www.mheducation.com/highered/mhp/product/save-world-code-20-fun-projects-all-ages-using-raspberry-pi-micro-bit-circuit-playground-express": images/save-the-world-with-code.webp
      "https://link.springer.com/book/10.1007/978-1-4842-5766-1": images/beginning-data-science-iot-and-ai-on-single-board-computers.webp
      "https://gethacking.com/products/the-tinkerers-guide-to-the-micro-bit-galaxy": images/the-tinkerers-guide-to-the-microbit-galaxy.webp
      "https://www.packtpub.com/en-us/product/bbc-microbit-in-practice-9781804610121": images/bbc-microbit-in-practice.webp
      "https://cmkpress.com/product/microbit/": images/the-invent-to-learn-guide-to-the-microbit.webp
      "https://ineasysteps.com/products-page/coding-with-the-microbit-create-cool-programming-projects/": images/coding-with-bbc-microbit-in-easy-steps.webp
      "https://link.springer.com/book/10.1007/978-1-4842-9197-9": images/microbit-projects-with-python-and-single-board-computers.webp
      "https://www.makershed.com/products/make-ai-robots-print": images/make-ai-robots.webp
      "https://mrmorrison.co.uk/books/": images/make-the-most-of-your-microbit.webp
