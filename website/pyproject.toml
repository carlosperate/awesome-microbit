[project]
name = "awesome-microbit"
version = "0.1.0"
description = "MkDocs project to build the Awesome micro:bit site"
requires-python = ">=3.11"
dependencies = []

# Groups, as pip can install them without building the site as a package
[dependency-groups]
site = ["mkdocs>=1.6", "Pillow>=10.1", "requests", "webpreview>=1.6.0"]
dev = [{include-group = "site"}, "pytest"]

[tool.pytest.ini_options]
testpaths = ["hooks/tests"]
# MkDocs loads the hooks by path, so the tests import them from there too
pythonpath = ["hooks"]
